# Render Web Service: the whole backend in one persistent process.
#
# `npm start` runs `dist/server.js`, which boots Next.js as a request handler
# inside a Node HTTP server it creates itself, connects Mongo, and attaches
# Socket.IO to that same server. One port therefore carries both halves: the
# REST routes under /api and the websocket at /socket.io.
#
# That is the whole reason for deploying here. On Vercel each route in
# `src/app/api` is an isolated serverless function; nothing executes
# `server.ts`, so `attachSocketServer` is never called and /api/health can
# only ever report the socket detached. A function cannot hold a websocket
# open, so it is not a setting to tweak — the runtime cannot host Socket.IO.
#
# The existing Vercel deployment can stay exactly as it is: it shares this
# MONGODB_URI and JWT_SECRET, so a token minted there authenticates here.
# Point the Flutter client's SOCKET_URL at this service.
#
# Deploy: Render dashboard > New > Blueprint, pointed at this file, then fill
# in the values marked `sync: false`.
services:
  - type: web
    name: scribble-and-guess
    runtime: node
    plan: starter
    region: oregon

    buildCommand: npm install && npm run build
    startCommand: npm start

    # Answered by the Next route, which reports the live Socket.IO state.
    # It returns 503 while Mongo is unreachable, so a broken instance is kept
    # out of rotation rather than serving sign-ins that cannot work.
    healthCheckPath: /api/health

    envVars:
      # Must be exactly "production", and it must not be "development".
      #
      # Render applies a service's environment to the build step as well as to
      # the running process, and `next build` with NODE_ENV=development in the
      # environment fails while prerendering /404 with
      #   Error: <Html> should not be imported outside of pages/_document
      # which names neither NODE_ENV nor the real problem. `npm run build` now
      # pins the value itself, so this is belt and braces — but if you add
      # variables through the dashboard, do not paste NODE_ENV=development from
      # .env.example.
      - key: NODE_ENV
        value: production

      # Render routes to the container's external interface, so the process
      # must not bind 127.0.0.1.
      - key: HOST
        value: 0.0.0.0

      # Render injects PORT and `env.ts` reads it. Never pin it here: a
      # hardcoded port is a service that never passes its health check.

      # Must be byte-identical to the Vercel deployment's value. A token
      # minted by /api/auth/guest there is verified here, and a different
      # secret rejects every handshake with AUTH_ERROR.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d

      # The same Atlas cluster the REST deployment writes to.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false

      # Browser origins allowed to call the API and open a socket. Native
      # Flutter clients send no Origin header and are unaffected either way.
      - key: CORS_ORIGIN
        sync: false

      # This service serves its own socket, so the in-process check answers
      # and the external probe in /api/health is never reached. Set it anyway
      # so the value advertised to clients is this origin rather than
      # localhost.
      - key: SOCKET_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false

      - key: LOG_LEVEL
        value: info

      # --- voice chat (WebRTC) ---------------------------------------------
      #
      # Only signalling passes through this service; the audio itself goes
      # peer to peer and never reaches the server, so voice adds no bandwidth
      # cost to this plan.
      #
      # STUN is free and sufficient for most networks. The default below is
      # Google's public server, which is what makes voice work with nothing
      # configured at all.
      - key: WEBRTC_STUN_URL
        value: stun:stun.l.google.com:19302

      # TURN is the fallback for peers behind a symmetric NAT that STUN cannot
      # traverse. It is optional, it is NOT free — every byte of audio is
      # relayed — and it needs a server you run (Coturn). Left unset, voice
      # still works for the large majority of players and simply fails to
      # connect for the rest.
      #
      # `sync: false` keeps the credential out of this file and in Render's
      # dashboard. Never commit a TURN password.
      - key: WEBRTC_TURN_URL
        sync: false
      - key: WEBRTC_TURN_USERNAME
        sync: false
      - key: WEBRTC_TURN_CREDENTIAL
        sync: false

      # Push notifications.
      #
      # A Firebase *service account*, which can deliver a notification to any
      # device in the project — so all three are `sync: false` and live in
      # Render's dashboard, never in this file. Leave them unset to run without
      # push: the tournament scheduler is unaffected and every send is a logged
      # no-op.
      #
      # FIREBASE_PRIVATE_KEY is a PEM block pasted as one line with its
      # newlines written as the two characters \n. See .env.example.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

      # The timezone the tournament day and its three slot times are read in.
      #
      # Pinned rather than left to the default because it decides when the
      # day rolls over and what "evening" means, and neither should depend on
      # which region Render happens to run this in.
      - key: TOURNAMENT_TIMEZONE
        value: Asia/Kolkata

      # The day's three tournaments, in that zone. There is no fourth: the
      # database keys them on {date, slot} behind a unique index.
      - key: TOURNAMENT_MORNING_AT
        value: "10:00"
      - key: TOURNAMENT_AFTERNOON_AT
        value: "15:00"
      - key: TOURNAMENT_EVENING_AT
        value: "20:00"

      # The check-in phase must be on for a check-in notification to exist at
      # all — with it off a tournament goes REGISTRATION -> STARTING -> RUNNING
      # and never enters CHECK_IN, so the push has nothing to fire on. It is
      # also the right phase for a scheduled tournament: registration opens
      # ninety minutes before the start, and a bracket drawn from everybody who
      # tapped join an hour earlier would be half walkovers. Pinned so turning
      # it off is a deliberate edit.
      - key: TOURNAMENT_CHECKIN_ENABLED
        value: "true"

    # A drawing game is stateful in memory: the live room registry belongs to
    # this process, and a player's socket must keep reaching the instance that
    # holds their room. Scaling past one instance needs the Redis adapter (see
    # the scaling note in `src/config/socket.ts`) before it is safe.
    numInstances: 1
